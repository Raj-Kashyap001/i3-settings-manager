name: Build and Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            upx \
            imagemagick \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxkbcommon-x11-0 # Added for PyQt6 compatibility

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pyinstaller
          if [ -f "requirements.txt" ]; then pip install -r requirements.txt; fi

      - name: Create appicon.png from SVG
        run: |
          if [ ! -f "appicon.png" ] && [ -f "appicon.svg" ]; then
            convert appicon.svg -resize 256x256 appicon.png
          fi

      - name: Build application
        run: python3 build.py

      - name: Test binary
        run: |
          if [ -f "dist/i3-settings-manager" ]; then
            file dist/i3-settings-manager
          else
            echo "Binary not found!"
            exit 1
          fi

      - name: Create release archive
        run: |
          # Use -p to ensure folders exist and ignore errors if they don't
          cp dist/i3-settings-manager .
          tar -czf i3-settings-manager-linux-x64.tar.gz \
            i3-settings-manager \
            README.md \
            LICENSE.md || echo "Some files missing, continuing..."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: i3-settings-manager-linux-x64
          path: i3-settings-manager-linux-x64.tar.gz

      - name: Create Release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: i3-settings-manager-linux-x64.tar.gz
          tag_name: v1.0.${{ github.run_number }}
          name: Release v1.0.${{ github.run_number }}
          body: |
            Automated build for i3 Settings Manager.
            Commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
